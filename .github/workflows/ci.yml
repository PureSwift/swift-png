# ci.yml - what every push has to survive
#
# Both build systems, both platforms.  SwiftPM is how the Swift library and its tests are
# driven; CMake is how the shipping C library is built and how the conformance suites compare
# it against the reference, so both have to stay green everywhere the library claims to run.
#
# The benchmark runs last and cannot fail the build: a timing taken on a shared runner
# measures the neighbours as much as the library.  It is here so that every push leaves a
# number in the log, which is what makes a regression something to notice rather than
# something to reconstruct.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    # Both compression backends, because they are different code from the chunk framing down:
    # the default is the Swift codec and links nothing, and the system-zlib build is what a
    # distribution wanting zlib's speed would ship — a regression in either should say which.
    strategy:
      fail-fast: false
      matrix:
        zlib: [OFF, ON]
    steps:
      - uses: actions/checkout@v4

      # ninja drives the CMake build; the reference libpng is what the conformance
      # suites compare against, found through pkg-config like any other client finds it.
      - name: Install dependencies
        run: brew install ninja libpng pkgconf

      - name: Build (SwiftPM)
        run: swift build -c release

      - name: Test (SwiftPM)
        run: swift test

      - name: Configure (CMake)
        run: cmake -G Ninja -B build/ci -DCMAKE_BUILD_TYPE=Release
              -DSPNG_USE_SYSTEM_ZLIB=${{ matrix.zlib }}

      - name: Build (CMake)
        run: cmake --build build/ci

      - name: Test (CTest)
        run: ctest --test-dir build/ci --output-on-failure

      - name: Benchmark, C API against the reference
        run: cmake --build build/ci --target benchmark

      - name: Benchmark, the engine driven from Swift
        run: .build/release/pngbench-swift build/ci/Conformance/corpus/rgb8-filter0.png

  # The reference here is built from source rather than taken from the distribution,
  # because the distribution's is old: Debian stable carries 1.6.39, where this library
  # implements the ABI of the version its own vendored headers come from.  Comparing
  # against 1.6.39 meant eight suites had to be excluded — not because this library was
  # wrong in them, but because the two libpngs disagree with each other, and in most of
  # those cases it is 1.6.39 that is the odd one out: it accepts png_set_shift values a
  # newer libpng rejects, it lacks the palette-index warning, it synthesises gAMA and
  # cHRM from an sRGB chunk.  Building the reference pins that variable instead of
  # recording its consequences, so the whole suite runs here, the same as on macOS.
  #
  # It is installed where the loader finds it on its own.  A reference somewhere else
  # would need LD_LIBRARY_PATH, and LD_LIBRARY_PATH outranks the RUNPATH our own
  # harnesses carry — so setting it made every "ours" binary load the reference and
  # quietly compare the reference against itself.  /usr/local/lib is already on the
  # default search path, so ldconfig is all this needs; the distribution's libpng-dev
  # is deliberately not installed, so there is only one reference to find.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.3.3-bookworm
    # The same two backends as the macos job, for the same reason.
    strategy:
      fail-fast: false
      matrix:
        zlib: [OFF, ON]
    env:
      LIBPNG_VERSION: "1.6.58"
    steps:
      - uses: actions/checkout@v4

      # The distribution's cmake is too old to drive Swift, so a current one comes from
      # pip.  No libpng-dev: the reference is the one built in the next step.
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq zlib1g-dev ninja-build pkg-config python3-pip curl
          pip3 install -q --break-system-packages cmake

      # The tag archive ships a pre-generated `configure`, so this needs no autotools.
      - name: Build the reference libpng
        run: |
          curl -fsSL "https://github.com/pnggroup/libpng/archive/refs/tags/v${LIBPNG_VERSION}.tar.gz" -o libpng.tar.gz
          tar xf libpng.tar.gz
          cd "libpng-${LIBPNG_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          make install
          ldconfig
          test "$(pkg-config --modversion libpng16)" = "${LIBPNG_VERSION}"

      - name: Build (SwiftPM)
        run: swift build -c release

      - name: Test (SwiftPM)
        run: swift test

      - name: Configure (CMake)
        run: cmake -G Ninja -B build/ci -DCMAKE_BUILD_TYPE=Release
              -DSPNG_USE_SYSTEM_ZLIB=${{ matrix.zlib }}

      - name: Build (CMake)
        run: cmake --build build/ci

      - name: Test (CTest)
        run: ctest --test-dir build/ci --output-on-failure

      - name: Benchmark, C API against the reference
        run: cmake --build build/ci --target benchmark

      - name: Benchmark, the engine driven from Swift
        run: .build/release/pngbench-swift build/ci/Conformance/corpus/rgb8-filter0.png
